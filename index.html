<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Happy Birthday, Sthalala</title>
<meta name="description" content="A birthday page for Sthalala." />
<meta name="theme-color" content="#c96b9f" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --plum: #ea9cc4;
    --plum-light: #e7b7d0;
    --plum-mid: #c96b9f;
    --plum-deep: #6f2a51;
    --plum-ink: #331025;
    --card: #f4d8e6;
    --gold: #d9b878;
    --text: var(--plum-ink);
    --muted: #4e1a3a;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  html { background: #a8558a; }

  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--plum) 0%, #d888b1 45%, #a8558a 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px) clamp(14px, 4vw, 32px) calc(clamp(16px, 4vw, 48px) + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  .page {
    width: min(100%, 720px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: clamp(14px, 2.6vw, 22px);
  }

  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(2.1rem, 8.4vw, 3.6rem);
    line-height: 1.08;
    margin: 0;
    letter-spacing: 0.5px;
  }

  .name {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(1.4rem, 5.4vw, 2rem);
    margin: 0;
    font-weight: 500;
  }

  .rule {
    width: min(100%, 560px);
    height: 2px;
    border: 0;
    margin: 2px 0 0;
    background: linear-gradient(90deg, transparent, var(--plum-mid) 12%, var(--plum-mid) 88%, transparent);
  }

  .tagline {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    color: var(--plum-deep);
    font-size: clamp(1.05rem, 4.4vw, 1.5rem);
    margin: 0;
  }

  .photo-frame {
    width: min(78%, 420px);
    aspect-ratio: 3 / 4;
    transform: rotate(-2.2deg);
    border-radius: 14px;
    overflow: hidden;
    background: var(--plum-light);
    box-shadow: 0 18px 44px rgba(51, 16, 37, .4);
    transition: transform .4s ease;
  }

  .photo-frame:hover { transform: rotate(0deg) scale(1.02); }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .message.highlight {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    color: var(--plum-deep);
    background: rgba(255, 255, 255, .45);
    border: 1px solid var(--plum);
    border-radius: var(--radius);
    padding: clamp(14px, 4vw, 22px) clamp(16px, 4vw, 26px);
    max-width: 40ch;
  }

  .message {
    color: var(--muted);
    font-size: clamp(1rem, 4vw, 1.2rem);
    line-height: 1.7;
    max-width: 44ch;
    margin: 0;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(10px, 2.6vw, 18px);
    width: 100%;
    justify-content: center;
  }

  button {
    font-family: inherit;
    font-size: clamp(1rem, 3.8vw, 1.15rem);
    font-weight: 700;
    border: 0;
    cursor: pointer;
    border-radius: 999px;
    padding: 1rem 1.4rem;
    flex: 1 1 200px;
    max-width: 320px;
    min-height: 56px;
    color: #fff;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }

  button:active { transform: translateY(2px) scale(.99); }
  button:focus-visible { outline: 3px solid var(--plum-deep); outline-offset: 3px; }

  .btn-primary {
    background: linear-gradient(180deg, var(--plum-mid) 0%, var(--plum-deep) 100%);
    color: #fff4f9;
    box-shadow: 0 10px 24px rgba(111, 42, 81, .38);
  }

  .btn-secondary {
    background: linear-gradient(180deg, #f9e3ee 0%, var(--plum) 100%);
    color: var(--plum-ink);
    box-shadow: 0 10px 24px rgba(111, 42, 81, .28);
    border: 1px solid var(--plum-deep);
  }

  button:hover { filter: brightness(1.06); }

  .surprise {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--plum);
    border-radius: var(--radius);
    padding: clamp(18px, 5vw, 30px);
    display: none;
    animation: rise .5s ease both;
  }

  .surprise.open { display: block; }

  .surprise h2 {
    font-family: "Playfair Display", Georgia, serif;
    color: var(--plum-deep);
    margin: 0 0 .6rem;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
  }

  .surprise p {
    margin: 0 0 1rem;
    color: var(--muted);
    line-height: 1.7;
    font-size: clamp(.98rem, 3.8vw, 1.1rem);
  }

  .surprise p:last-child { margin-bottom: 0; }

  .blessing {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-size: clamp(1.1rem, 4.4vw, 1.4rem);
    color: var(--plum-deep);
  }

  .mncwaa {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    letter-spacing: .3em;
    font-size: clamp(1.4rem, 6vw, 2.2rem);
    color: var(--plum-ink);
    margin: 0;
  }

  .wishes {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: .6rem;
    text-align: left;
  }

  .wishes li {
    background: rgba(111, 42, 81, .12);
    border-left: 3px solid var(--plum-deep);
    border-radius: 10px;
    padding: .7rem .9rem;
    color: var(--text);
    font-size: clamp(.95rem, 3.6vw, 1.05rem);
  }

  footer {
    color: rgba(51, 16, 37, .6);
    font-size: .85rem;
    margin-top: .5rem;
  }

  canvas#confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  @media (min-width: 820px) {
    .page { gap: 26px; }
    .photo-frame { width: min(60%, 400px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="page">
    <h1>Happy Birthday,<br />Sthalala</h1>
    <p class="name">Sthalala</p>
    <hr class="rule" />
    <p class="tagline">today the world got a little brighter</p>

    <figure class="photo-frame">
      <img src="photo.jpg" alt="Sthalala smiling at an outdoor park" />
    </figure>

    <p class="message highlight">
      Happy birthday to my sweet, beautiful Nyalo. I'm sending you a lot of mncwaa today as you
      celebrate your special day.
    </p>

    <div class="actions">
      <button class="btn-primary" id="surpriseBtn" aria-expanded="false" aria-controls="surprise">Open your surprise</button>
      <button class="btn-secondary" id="songBtn" aria-pressed="false">🎵 Play song</button>
    </div>

    <audio id="song" src="song.mp3" preload="auto" loop autoplay playsinline></audio>

    <section class="surprise" id="surprise" aria-live="polite">
      <h2>Your surprise 🎁</h2>
      <p class="blessing">May the almighty shower blessings upon you today, best wishes.</p>
      <p class="mncwaa">MNCWAA</p>
    </section>

    <footer>Made with love · <span id="year"></span></footer>
  </main>

<script>
(function () {
  document.getElementById('year').textContent = new Date().getFullYear();

  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var pieces = [];
  var running = false;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var colors = ['#ea9cc4', '#c96b9f', '#fff4f9', '#6f2a51', '#a8558a'];

  function burst(count) {
    for (var i = 0; i < count; i++) {
      pieces.push({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * window.innerHeight * 0.4,
        w: 6 + Math.random() * 7,
        h: 8 + Math.random() * 10,
        vy: 2 + Math.random() * 3.5,
        vx: -1.2 + Math.random() * 2.4,
        rot: Math.random() * Math.PI,
        vr: -0.12 + Math.random() * 0.24,
        color: colors[(Math.random() * colors.length) | 0]
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function tick() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (var i = pieces.length - 1; i >= 0; i--) {
      var p = pieces[i];
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      if (p.y > window.innerHeight + 40) pieces.splice(i, 1);
    }
    if (pieces.length) { requestAnimationFrame(tick); }
    else { running = false; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var surpriseBtn = document.getElementById('surpriseBtn');
  var surprise = document.getElementById('surprise');

  surpriseBtn.addEventListener('click', function () {
    var open = surprise.classList.toggle('open');
    surpriseBtn.setAttribute('aria-expanded', String(open));
    surpriseBtn.textContent = open ? 'Close the surprise' : 'Open your surprise';
    if (open) {
      if (!reduced) burst(140);
      surprise.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
    }
  });

  var songBtn = document.getElementById('songBtn');
  var song = document.getElementById('song');

  function setSongLabel(playing) {
    songBtn.textContent = playing ? '⏸ Pause song' : '🎵 Play song';
    songBtn.setAttribute('aria-pressed', String(playing));
  }

  song.addEventListener('play', function () { setSongLabel(true); if (!reduced) burst(70); });
  song.addEventListener('pause', function () { setSongLabel(false); });
  song.addEventListener('ended', function () { setSongLabel(false); if (!reduced) burst(110); });

  var userPaused = false;

  function tryPlay() {
    if (userPaused || !song.paused) return;
    var p = song.play();
    if (p && p.catch) p.catch(function () {});
  }

  songBtn.addEventListener('click', function () {
    if (song.paused) {
      userPaused = false;
      tryPlay();
    } else {
      userPaused = true;
      song.pause();
    }
  });

  ['click', 'touchstart', 'keydown', 'scroll'].forEach(function (evt) {
    window.addEventListener(evt, tryPlay, { passive: true });
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tryPlay();
  });

  tryPlay();
})();
</script>
</body>
</html>
